[storage]
database     = "data/rac1.sqlite3"
download_dir = "data/podcasts"

[http]
timeout_seconds      = 30.0
max_retries          = 3
backoff_base_seconds = 1.0
user_agent           = "rac1-podcast-sync/1.0 (+correu@exemple.cat)"

[sync]
max_concurrent_downloads = 1
max_episodes_per_run     = 0
interval_minutes         = 60

[[feeds]]
name = "via-lliure-hora-a-hora"
url  = "https://api.audioteca.rac1.cat/rss/via-lliure/"
transcriptionService = "SoftCatala"
