[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rac1-podcast-sync"
version = "1.0.0"
description = "Descarrega periòdicament els podcasts de RAC1 sense repetits"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
rac1sync = "rac1sync.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rac1sync"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
